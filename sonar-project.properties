sonar.projectKey=kennethsuarez_recipe-api
sonar.organization=kennethsuarez

sonar.projectName=Recipe API
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.junit.reportPaths=target/surefire-reports

# Pure framework bean-wiring with no business logic to regression-test;
# excluded from the coverage gate, not from testing in general.
sonar.coverage.exclusions=\
  **/RecipeApiApplication.java,\
  **/config/SwaggerConfiguration.java,\
  **/config/SwaggerUIController.java,\
  **/config/TomcatLimitsConfiguration.java
