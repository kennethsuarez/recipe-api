spring.application.name=recipe-api
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/recipes}
spring.datasource.username=${DB_USERNAME:recipes}
spring.datasource.password=${DB_PASSWORD:recipes}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_ACQUIRE_TIMEOUT_MS:2000}
spring.datasource.hikari.data-source-properties.connectTimeout=3
spring.datasource.hikari.data-source-properties.socketTimeout=5
spring.datasource.hikari.connection-init-sql=SET statement_timeout = '${DB_STATEMENT_TIMEOUT_MS:3000}ms'; SET lock_timeout = '${DB_LOCK_TIMEOUT_MS:1000}ms'
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.mvc.problemdetails.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
server.tomcat.threads.max=${HTTP_MAX_THREADS:48}
server.tomcat.threads.min-spare=${HTTP_MIN_THREADS:4}
server.tomcat.max-connections=${HTTP_MAX_CONNECTIONS:128}
server.tomcat.accept-count=${HTTP_ACCEPT_COUNT:32}
server.tomcat.connection-timeout=5s
server.tomcat.keep-alive-timeout=10s
server.max-http-request-header-size=16KB
recipe.max-offset=${RECIPE_MAX_OFFSET:10000}
recipe.max-request-bytes=${RECIPE_MAX_REQUEST_BYTES:524288}
recipe.max-concurrent-requests=${RECIPE_MAX_CONCURRENT_REQUESTS:32}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
recipe.http-task-queue-size=${RECIPE_HTTP_TASK_QUEUE_SIZE:32}
spring.jpa.properties.hibernate.log_slow_query=500
logging.structured.format.console=ecs
springdoc.api-docs.path=/docs-json
springdoc.swagger-ui.path=/docs.html
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.operations-sorter=method
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
recipe.openapi.title=${OPENAPI_TITLE:Recipe API}
recipe.openapi.description=${OPENAPI_DESCRIPTION:Recipe management and bounded, composable recipe search}
recipe.openapi.version=${OPENAPI_VERSION:1.0.0}
recipe.openapi.server-url=${OPENAPI_SERVER_URL:http://localhost:8080}
